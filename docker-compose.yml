services:
  postgres:
    image: postgres:16
    container_name: pdm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: appuser
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pdm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser"]
      interval: 5s
      timeout: 5s
      retries: 10

  ssh:
    build:
      context: ./docker/ssh
      args:
        SSH_USER: appuser
        SSH_PASSWORD: appuser
    container_name: pdm_ssh
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "2222:22"

volumes:
  pdm_postgres_data:
