[project]
name = "postgresql-data-manager"
version = "0.1.0"
description = "Desktop application for browsing and administering PostgreSQL databases through SSH"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "customtkinter",
    "openpyxl",
    "pandas",
    "paramiko",
    "python-dotenv>=1.2.3",
    "reportlab",
    "xlrd",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
pgdm = "pgdm.app:main"

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.hatch.build.targets.wheel]
packages = ["src/pgdm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
